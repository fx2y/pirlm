[project]
name = "pirml"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
pirml = "pirml.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
