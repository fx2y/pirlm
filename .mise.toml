[tools]
python = "3.12"
uv = "latest"
ruff = "latest"
jq = "latest"
node = "24"
"npm:pyright" = "latest"
"cargo:hyperfine" = "latest"
"cargo:watchexec-cli" = "latest"

[env]
PYTHONHASHSEED = "0"
TZ = "UTC"
LC_ALL = "C"
LANG = "C"
SOURCE_DATE_EPOCH = "1700000000"
NO_COLOR = "1"

[tasks.boot]
description = "Install pinned tools and Python dev deps"
alias = ["b"]
run = "mise install && uv venv && uv pip install -r requirements-dev.txt"

[tasks.default]
description = "List task contract (descriptions/aliases)"
run = "mise tasks"

[tasks.fmt]
description = "Format Python sources with Ruff"
run = "ruff format ."

[tasks.lint]
description = "Lint Python sources with Ruff"
run = "ruff check ."

[tasks.types]
description = "Static type-check with Pyright"
run = "pyright"

[tasks.unit]
description = "Run deterministic unittest suite"
run = "python -m unittest -q"

[tasks.proto]
description = "Validate protocol invariants over trace.ndjson"
run = "python -m pirml --prog tests/prog_ok.py --out-dir out/ci && python -m scripts.proto_lint --trace out/ci/trace.ndjson"

[tasks.trace]
description = "Validate JSONL trace format constraints"
run = "python -m pirml --prog tests/prog_ok.py --out-dir out/ci && python -m scripts.trace_lint --trace out/ci/trace.ndjson"

[tasks.schemas]
description = "Validate final.json against JSON schema contract"
run = "python -m pirml --prog tests/prog_ok.py --out-dir out/ci && python -m scripts.schema_lint"

[tasks.replay]
description = "Check replay byte-stability and no-tool execution"
run = "python -m scripts.replay_check"

[tasks.fast]
description = "Inner loop gate (<3s target): lint+subset unit+proto"
alias = ["f"]
run = "ruff check pirml scripts tests && python -m unittest -q tests.test_protocol tests.test_replay tests.test_c0_reconcile && python -m pirml --prog tests/prog_ok.py --out-dir out/fast && python -m scripts.proto_lint --trace out/fast/trace.ndjson && python -m scripts.schema_lint"

[tasks.ci]
description = "Full deterministic fail-fast gate ladder"
alias = ["check", "C"]
run = "mise run fmt && mise run lint && mise run types && mise run unit && mise run proto && mise run trace && mise run schemas && mise run replay"

[tasks.bench]
description = "Perf smoke benchmark with hyperfine"
run = "python -m scripts.bench"
