[tools]
python = "3.12"
uv = "latest"
ruff = "latest"
jq = "latest"
node = "24"
"npm:pyright" = "latest"
"cargo:hyperfine" = "latest"
"cargo:watchexec-cli" = "latest"

[env]
PYTHONHASHSEED = "0"
TZ = "UTC"
LC_ALL = "C"
LANG = "C"
SOURCE_DATE_EPOCH = "1700000000"
NO_COLOR = "1"

[tasks.boot]
description = "Install pinned tools and Python dev deps"
alias = ["b"]
run = "mise install && uv venv && uv pip install -r requirements-dev.txt"

[tasks.default]
description = "List task contract (descriptions/aliases)"
run = "mise tasks"

[tasks.fmt]
description = "Format Python sources with Ruff"
run = "ruff format ."

[tasks.lint]
description = "Lint Python sources with Ruff"
run = "ruff check ."

[tasks.types]
description = "Static type-check with Pyright"
run = "pyright"

[tasks.unit]
description = "Run deterministic unittest suite"
run = "python -m unittest -q"

[tasks.proto]
description = "Validate protocol invariants over trace.ndjson"
run = "python -m pirml --prog tests/prog_ok.py --out-dir out/ci && python -m scripts.proto_lint --trace out/ci/trace.ndjson"

[tasks.trace]
description = "Validate JSONL trace format constraints"
run = "python -m pirml --prog tests/prog_ok.py --out-dir out/ci && python -m scripts.trace_lint --trace out/ci/trace.ndjson"

[tasks.schemas]
description = "Validate final.json, contract.json and tool manifests against JSON schema contracts"
run = """
rm -rf out/compile-*
python -m pirml --prog tests/prog_ok.py --out-dir out/ci
export PIRML_MODEL_RAW='<<<PROG>>>
import asyncio
from pirml.runtime.rpc import send_final
async def main():
    send_final(True, {"ok":True,"results":[]})
if __name__=="__main__":
    asyncio.run(main())
<<<CONTRACT>>>
{"tool_deps":[],"io_schema":{"final_schema":{},"citations_schema":{},"trace_ptr":"t"},"budgets":{"max_calls":1,"max_parallel":1,"max_bytes_in":1,"max_bytes_out":1,"timeout_s":1},"assertions":[]}
'
python -m scripts.compile --task 'smoke' --tools-dir tests/fixtures/toolsearch/catalog --out-dir out/compile-smoke
export PIRML_MODEL_RAW='invalid'
python -m scripts.compile --task 'smoke' --tools-dir tests/fixtures/toolsearch/catalog --out-dir out/compile-fail || true
python -m scripts.schema_lint --final out/ci/final.json --contract out/compile-smoke/contract.json --compile-error out/compile-fail/compile_error.json
python -m scripts.web_fixture_smoke
python -m scripts.schema_lint --serp out/web_smoke/serp.ndjson --doc out/web_smoke/doc.ndjson --extract out/web_smoke/extract.ndjson --citation out/web_smoke/citation.ndjson --web-eval out/web_smoke/eval.ndjson
python -m scripts.tool_manifest_lint
"""

[tasks.replay]
description = "Check replay byte-stability and no-tool execution"
run = "python -m scripts.replay_check"

[tasks.fast]
description = "Inner loop gate (<3s target): lint + toolsearch + compile-lite"
alias = ["f"]
run = "ruff check pirml scripts tests && python -m unittest -q tests.test_toolsearch_lint tests.test_toolsearch_search tests.test_toolsearch_hydrate_render tests.test_toolsearch_bets tests.test_toolsearch_golden tests.test_compile_extract tests.test_compile_verify tests.test_compile_golden tests.test_urlnorm tests.test_web_search"

[tasks.ci]
description = "Full deterministic fail-fast gate ladder"
alias = ["check", "C"]
run = "mise run fmt && mise run lint && mise run types && mise run unit && mise run proto && mise run trace && mise run schemas && mise run replay"

[tasks.bench]
description = "Perf smoke benchmark with hyperfine"
run = "python -m scripts.bench"

[tasks."bench-web"]
description = "Web substrate benchmark"
run = "python -m scripts.tool_search_bench --web"

[tasks."eval-web"]
description = "Web evaluation matrix + winner selection"
run = "python -m scripts.web_eval"
